<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop | VELQORO</title><style>body{font-family:Arial;margin:0;background:#fafafa;color:#111}.nav{padding:20px 5%;display:flex;justify-content:space-between;background:#fff;border-bottom:1px solid #eee}.wrap{padding:50px 5%}.filters{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}.saleBadge{position:absolute;top:10px;left:10px;background:#6d7048;color:#fff;padding:7px 9px;font-size:10px;letter-spacing:1px}.pic{position:relative;overflow:hidden}.old{color:#999;text-decoration:line-through;font-size:12px;margin-left:8px}.saleTitle{font-family:Georgia,serif;font-weight:400}button{padding:10px 16px;border:1px solid #111;background:#fff;border-radius:99px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{background:#fff;border:1px solid #eee;border-radius:16px;overflow:hidden}.pic{height:300px;background:#ddd;display:grid;place-items:center}.shirt{width:55%;height:65%;background:#222;clip-path:polygon(25% 8%,39% 0,50% 10%,61% 0,75% 8%,100% 35%,82% 53%,72% 38%,72% 100%,28% 100%,28% 38%,18% 53%,0 35%)}.info{padding:16px}.add{background:#111;color:#fff;width:100%;margin-top:10px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style><style>:root{--gold:#b58a4b;--ink:#211b18;--cream:#f8f3eb;--line:#e7ded2}body{background:var(--cream)!important;color:var(--ink)!important}a{color:inherit}.nav,.top{background:#211b18!important;color:#fff!important}button,.checkout,.add{background:linear-gradient(135deg,#b58a4b,#e0c28d)!important;color:#211b18!important;border:0!important;box-shadow:0 4px 0 #8a6534,0 8px 18px #00000012}.card,.box,.panel,.loginbox{border-color:var(--line)!important;border-radius:16px!important;box-shadow:0 10px 25px #38291a0c}h1,h2,h3{color:#30241b}@media(max-width:600px){.wrap{padding-left:16px!important;padding-right:16px!important}}</style></head><body><nav class=nav><b>VELQORO</b><a href="cart.html">Cart 🛒</a></nav><main class=wrap><h1 class=saleTitle>Shop the Collection</h1><p>Everyday essentials, fresh fits and limited-time offers.</p><div class=filters><button onclick="filter(&quot;Men&quot;)">Men</button><button onclick="filter(&quot;Women&quot;)">Women</button><button onclick="filter(&quot;Kids&quot;)">Kids</button><button onclick="filter(&quot;Sale&quot;)">Sale</button><button onclick="filter('All')">All</button><button onclick="filter('T-Shirts')">T-Shirts</button><button onclick="filter('Bottomwear')">Bottomwear</button><button onclick="filter('Hoodies')">Hoodies</button></div><div class=grid id=g></div></main><script>const catalogGroups=[
{department:"Men",categories:[["T-Shirts",["Essential Cotton T-Shirt","Oversized Street Tee","Graphic Print Tee","Polo T-Shirt"],[499,699,599,799]],["Shirts",["Casual Oxford Shirt","Checked Casual Shirt","Linen Blend Shirt","Denim Shirt"],[899,999,1099,1199]],["Jeans",["Slim Fit Jeans","Relaxed Blue Jeans","Black Denim Jeans","Straight Fit Jeans"],[1299,1499,1399,1599]],["Hoodies",["Everyday Hoodie","Zip-Up Hoodie","Graphic Hoodie","Fleece Sweatshirt"],[1199,1499,1399,1299]]]},
{department:"Women",categories:[["Tops",["Everyday Ribbed Top","Relaxed Fit Shirt","Printed Casual Top","Classic Crop Top"],[599,899,699,649]],["Dresses",["Floral Midi Dress","Everyday Shirt Dress","Evening Maxi Dress","Casual Summer Dress"],[1299,1599,1899,1199]],["Women Jeans",["High-Rise Straight Jeans","Wide-Leg Denim","Skinny Fit Jeans","Relaxed Mom Jeans"],[1399,1599,1299,1499]],["Ethnic Wear",["Printed Kurta","Kurta Trouser Set","Festive Straight Kurta","Everyday Cotton Kurta"],[999,1799,1499,899]]]},
{department:"Kids",categories:[["Kids T-Shirts",["Kids Cotton T-Shirt","Dino Print Tee","Colour Block Tee","Kids Polo Tee"],[299,399,349,449]],["Kids Sets",["T-Shirt Shorts Set","Printed Co-Ord Set","Everyday Cotton Set","Sporty Tracksuit Set"],[599,799,699,999]],["Kids Dresses",["Floral Party Dress","Everyday Frock","Printed Summer Dress","Festive Kids Dress"],[899,699,799,1199]],["Kids Bottomwear",["Kids Denim Jeans","Cotton Joggers","Casual Shorts","Stretchable Trousers"],[699,499,349,599]]]}
];
function buildCatalog(){const out=[];let id=100;catalogGroups.forEach(group=>group.categories.forEach(row=>row[1].forEach((name,i)=>out.push({id:id++,name,department:group.department,cat:row[0],price:row[2][i],discount:i===0?10:0,stock:12,image:"",description:group.department+" "+row[0]+" — comfortable everyday style."}))));return out;}
const defaults=buildCatalog();let ps=JSON.parse(localStorage.getItem("velqoro_products")||"null");if(!ps){ps=defaults;localStorage.setItem("velqoro_products",JSON.stringify(ps));}else if(!localStorage.getItem("velqoro_catalog_v2")){const names=new Set(ps.map(p=>p.name));ps=ps.concat(defaults.filter(p=>!names.has(p.name)));localStorage.setItem("velqoro_products",JSON.stringify(ps));localStorage.setItem("velqoro_catalog_v2","1");}let c=JSON.parse(localStorage.getItem("velqoro_cart")||"[]");function add(id){let p=ps.find(x=>x.id===id),x=c.find(x=>x.id===id);x?x.qty++:c.push({...p,qty:1});localStorage.setItem("velqoro_cart",JSON.stringify(c));alert("Added to cart")}function filter(cat){let items=ps.filter(p=>cat==="All"||(cat==="Sale"?Number(p.discount||0)>0:(p.department===cat||p.cat===cat)));g.innerHTML=items.map(p=>{let price=Number(p.price||0),discount=Number(p.discount||0),now=Math.round(price*(1-discount/100));return '<article class=card><div class=pic>'+(p.image?'<img src="'+p.image+'" style="width:100%;height:100%;object-fit:cover">':'<div class=shirt></div>')+(discount?'<span class=saleBadge>'+discount+'% OFF</span>':'')+'</div><div class=info><h3>'+p.name+'</h3><b>₹'+now+'</b>'+(discount?'<span class=old>₹'+price+'</span>':'')+'<button class=add onclick="add('+p.id+')">Add to Cart</button></div></article>'}).join('')||'<p>No products in this section yet.</p>'}const params=new URLSearchParams(location.search);filter(params.get("filter")==="sale"?"Sale":params.get("department")||params.get("cat")||"All")</script></body></html>
