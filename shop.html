<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop | VELQORO</title><style>body{font-family:Arial;margin:0;background:#fafafa;color:#111}.nav{padding:20px 5%;display:flex;justify-content:space-between;background:#fff;border-bottom:1px solid #eee}.wrap{padding:50px 5%}.filters{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}button{padding:10px 16px;border:1px solid #111;background:#fff;border-radius:99px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{background:#fff;border:1px solid #eee;border-radius:16px;overflow:hidden}.pic{height:300px;background:#ddd;display:grid;place-items:center}.shirt{width:55%;height:65%;background:#222;clip-path:polygon(25% 8%,39% 0,50% 10%,61% 0,75% 8%,100% 35%,82% 53%,72% 38%,72% 100%,28% 100%,28% 38%,18% 53%,0 35%)}.info{padding:16px}.add{background:#111;color:#fff;width:100%;margin-top:10px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style><style>:root{--gold:#b58a4b;--ink:#211b18;--cream:#f8f3eb;--line:#e7ded2}body{background:var(--cream)!important;color:var(--ink)!important}a{color:inherit}.nav,.top{background:#211b18!important;color:#fff!important}button,.checkout,.add{background:linear-gradient(135deg,#b58a4b,#e0c28d)!important;color:#211b18!important;border:0!important;box-shadow:0 4px 0 #8a6534,0 8px 18px #00000012}.card,.box,.panel,.loginbox{border-color:var(--line)!important;border-radius:16px!important;box-shadow:0 10px 25px #38291a0c}h1,h2,h3{color:#30241b}@media(max-width:600px){.wrap{padding-left:16px!important;padding-right:16px!important}}</style></head><body><nav class=nav><b>VELQORO</b><a href="cart.html">Cart 🛒</a></nav><main class=wrap><h1>Shop All</h1><div class=filters><button onclick="filter('All')">All</button><button onclick="filter('T-Shirts')">T-Shirts</button><button onclick="filter('Bottomwear')">Bottomwear</button><button onclick="filter('Hoodies')">Hoodies</button></div><div class=grid id=g></div></main><script>const defaults=[{id:1,name:"Essential Black T-Shirt",price:499,discount:0,cat:"T-Shirts",stock:20,image:""},{id:2,name:"Oversized Street Tee",price:699,discount:0,cat:"T-Shirts",stock:15,image:""},{id:3,name:"Classic Cargo Pants",price:999,discount:0,cat:"Bottomwear",stock:10,image:""},{id:4,name:"Everyday Hoodie",price:1199,discount:0,cat:"Hoodies",stock:8,image:""}];const ps=JSON.parse(localStorage.getItem("velqoro_products")||"null")||defaults;let c=JSON.parse(localStorage.getItem("velqoro_cart")||"[]");function add(id){let p=ps.find(x=>x.id===id),x=c.find(x=>x.id===id);x?x.qty++:c.push({...p,qty:1});localStorage.setItem("velqoro_cart",JSON.stringify(c));alert("Added to cart")}function filter(cat){g.innerHTML=ps.filter(p=>cat==="All"||p.cat===cat).map(p=>`<article class=card><div class=pic>${p.image?'<img src="'+p.image+'" style="width:100%;height:100%;object-fit:cover">':'<div class=shirt></div>'}</div><div class=info><h3>${p.name}</h3><b>₹${Math.round(Number(p.price||0)*(1-Number(p.discount||0)/100))}</b><button class=add onclick="add(${p.id})">Add to Cart</button></div></article>`).join("")}filter("All")</script></body></html>
