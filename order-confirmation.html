<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Confirmation | VELQORO</title><style>*{box-sizing:border-box}body{margin:0;background:#fbf7f0;color:#241c16;font:16px/1.6 Arial,sans-serif}.wrap{max-width:680px;margin:7vh auto;padding:20px}.card{background:white;border:1px solid #eadfce;border-radius:20px;padding:28px}.mark{width:58px;height:58px;border-radius:50%;background:#e8f5e9;color:#237a39;display:grid;place-items:center;font-size:32px}.brand{letter-spacing:4px;font:26px Georgia,serif;margin-bottom:22px}h1{font:32px Georgia,serif}.muted{color:#6b6258}.item{display:flex;justify-content:space-between;gap:15px;border-bottom:1px solid #eee;padding:10px 0}.pill{display:inline-block;padding:12px 16px;border-radius:10px;background:#241c16;color:#f4e1b7;text-decoration:none;margin:8px 6px 0 0}.warn{padding:12px;border-radius:10px;background:#fff5dd;font-size:13px}</style></head><body><main class="wrap"><div class="brand">VELQORO</div><div class="card"><div class="mark">✓</div><h1>Order request received</h1><p id="orderNo" class="muted">Loading order…</p><div id="details"></div><p class="warn">Order details in this version are stored in this browser only. SMS and shared online order records are not active yet.</p><p><b>Need help?</b><br><a href="mailto:velq0r00@gmail.com">velq0r00@gmail.com</a><br><a href="tel:8054862251">8054862251</a></p><a class="pill" href="shop.html">Continue shopping</a><a class="pill" href="index.html">Home</a></div></main><script>function money(n){return "₹"+Number(n||0).toLocaleString("en-IN")}const key=new URLSearchParams(location.search).get("order"),orders=JSON.parse(localStorage.getItem("velqoro_orders")||"[]"),o=orders.find(x=>String(x.orderNumber||x.id)===key);if(!o){document.getElementById("orderNo").textContent="Order details could not be found in this browser.";document.getElementById("details").textContent="Please contact support if you need help."}else{document.getElementById("orderNo").textContent="Order number: "+o.orderNumber;document.getElementById("details").innerHTML="<p><b>Status:</b> "+o.status+"<br><b>Customer:</b> "+o.customer+"<br><b>Phone:</b> "+o.phone+"<br><b>Delivery address:</b> "+[o.address,o.city,o.pincode].filter(Boolean).join(", ")+"<br><b>Payment:</b> "+o.paymentMethod+"<br><b>Total:</b> "+money(o.total)+"</p><h3>Items</h3>"+(o.items||[]).map(i=>'<div class="item"><span>'+String(i.name||"Product").replace(/[&<>"]/g,"")+' × '+(i.qty||1)+'</span><b>'+money((i.price||0)*(i.qty||1))+'</b></div>').join("")}</script></body></html>
