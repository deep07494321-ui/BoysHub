<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VELQORO | Packed With Care</title><style>*{box-sizing:border-box}html,body{margin:0;background:#0b0b0b;color:#fff;font-family:Inter,Arial}.top{position:fixed;top:0;left:0;right:0;padding:22px 5%;display:flex;justify-content:space-between;z-index:3}.hint{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);padding:10px 16px;border:1px solid #555;border-radius:999px;background:#111b;font-size:13px;z-index:3}.stage{height:500vh;position:relative}.sticky{position:sticky;top:0;height:100vh;overflow:hidden;display:grid;place-items:center}.video{width:min(900px,92vw);max-height:78vh;object-fit:contain;background:#111}.copy{position:absolute;top:20%;left:6%;max-width:330px;text-shadow:0 2px 20px #000}.copy h1{font-size:clamp(38px,6vw,80px);margin:0}.copy p{color:#bbb;line-height:1.6}.bar{position:absolute;bottom:30px;left:6%;right:6%;height:3px;background:#444}.progress{height:100%;width:0;background:#fff}.end{height:100vh;display:grid;place-items:center;text-align:center;padding:20px}.end h2{font-size:60px;margin:0}@media(max-width:700px){.copy{top:14%;left:5%;right:5%}.copy p{display:none}}</style><style>:root{--gold:#b58a4b;--ink:#211b18;--cream:#f8f3eb;--line:#e7ded2}body{background:var(--cream)!important;color:var(--ink)!important}a{color:inherit}.nav,.top{background:#211b18!important;color:#fff!important}button,.checkout,.add{background:linear-gradient(135deg,#b58a4b,#e0c28d)!important;color:#211b18!important;border:0!important;box-shadow:0 4px 0 #8a6534,0 8px 18px #00000012}.card,.box,.panel,.loginbox{border-color:var(--line)!important;border-radius:16px!important;box-shadow:0 10px 25px #38291a0c}h1,h2,h3{color:#30241b}@media(max-width:600px){.wrap{padding-left:16px!important;padding-right:16px!important}}</style></head><body><div class=top><b>VELQORO</b><a href="index.html">Skip →</a></div><section class=stage><div class=sticky><video class=video id=v muted playsinline preload=auto src="assets/packing.mp4"></video><div class=copy><small>THE VELQORO EXPERIENCE</small><h1>PACKED<br>WITH CARE.</h1><p>Scroll down and watch your order go from our hands to its final pack.</p></div><div class=bar><div class=progress id=p></div></div><div class=hint>↓ Scroll to pack</div></div></section><section class=end><div><small>READY TO SHIP</small><h2>Your style.<br>On its way.</h2><a href="shop.html" style="display:inline-block;margin-top:20px;padding:14px 22px;border-radius:999px;background:#fff;color:#111;font-weight:800">Shop VELQORO</a></div></section><script>const v=document.getElementById('v'),stage=document.querySelector('.stage'),bar=document.getElementById('p');function sync(){if(!v.duration)return;let r=stage.getBoundingClientRect(),max=stage.offsetHeight-innerHeight,prog=Math.min(1,Math.max(0,-r.top/max));v.currentTime=prog*v.duration;bar.style.width=prog*100+'%'}addEventListener('scroll',sync,{passive:true});v.addEventListener('loadedmetadata',sync);</script></body></html>
