<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart & Checkout | VELQORO</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#fafafa;color:#111}.nav{padding:20px 5%;background:#fff;border-bottom:1px solid #eee;display:flex;justify-content:space-between}.wrap{max-width:1100px;margin:45px auto;padding:0 20px}.layout{display:grid;grid-template-columns:1.4fr .8fr;gap:24px}.box{background:#fff;border:1px solid #eee;border-radius:18px;padding:24px}.item{display:flex;gap:18px;align-items:center;padding:18px 0;border-bottom:1px solid #eee}.thumb{width:85px;height:85px;background:#ddd;border-radius:12px;display:grid;place-items:center}.mini{width:55%;height:65%;background:#222;clip-path:polygon(25% 8%,39% 0,50% 10%,61% 0,75% 8%,100% 35%,82% 53%,72% 38%,72% 100%,28% 100%,28% 38%,18% 53%,0 35%)}.grow{flex:1}.qty button{border:1px solid #ddd;background:#fff;border-radius:6px;padding:5px 9px}.total{display:flex;justify-content:space-between;font-size:20px;font-weight:900;margin:20px 0}.checkout{width:100%;padding:15px;border:0;border-radius:10px;background:#111;color:#fff;font-weight:800;cursor:pointer}input{width:100%;padding:13px;border:1px solid #ddd;border-radius:9px;margin:7px 0 14px}@media(max-width:800px){.layout{grid-template-columns:1fr}}</style><style>:root{--gold:#b58a4b;--ink:#211b18;--cream:#f8f3eb;--line:#e7ded2}body{background:var(--cream)!important;color:var(--ink)!important}a{color:inherit}.nav,.top{background:#211b18!important;color:#fff!important}button,.checkout,.add{background:linear-gradient(135deg,#b58a4b,#e0c28d)!important;color:#211b18!important;border:0!important;box-shadow:0 4px 0 #8a6534,0 8px 18px #00000012}.card,.box,.panel,.loginbox{border-color:var(--line)!important;border-radius:16px!important;box-shadow:0 10px 25px #38291a0c}h1,h2,h3{color:#30241b}@media(max-width:600px){.wrap{padding-left:16px!important;padding-right:16px!important}}</style></head><body><nav class=nav><a href="index.html"><b>VELQORO</b></a><a href="shop.html">Continue Shopping</a></nav><main class=wrap><h1>Your Cart</h1><div class=layout><section class=box id=items></section><section class=box><h2>Checkout</h2><input id=name placeholder="Full name"><input id=phone placeholder="Mobile number"><input id=address placeholder="Delivery address"><input id=city placeholder="City"><input id=pincode placeholder="Pincode"><div class=total><span>Total</span><span>₹<span id=total>0</span></span></div><button class=checkout onclick=placeOrder()>Place Order</button><p style="font-size:12px;color:#777">Demo checkout: payment gateway can be connected next.</p></section></div></main><script>let cart=JSON.parse(localStorage.getItem("velqoro_cart")||"[]");function money(n){return Number(n).toLocaleString("en-IN")}function render(){if(!cart.length){items.innerHTML='<p>Your cart is empty. <a href="shop.html"><b>Shop now →</b></a></p>';total.textContent='0';return}items.innerHTML=cart.map((p,i)=>`<div class=item><div class=thumb><div class=mini></div></div><div class=grow><b>${p.name}</b><div>₹${money(p.price)}</div></div><div class=qty><button onclick="change(${i},-1)">−</button> ${p.qty} <button onclick="change(${i},1)">+</button></div></div>`).join("");total.textContent=money(cart.reduce((s,p)=>s+p.price*p.qty,0))}function change(i,n){cart[i].qty+=n;if(cart[i].qty<=0)cart.splice(i,1);localStorage.setItem("velqoro_cart",JSON.stringify(cart));render()}function placeOrder(){if(!cart.length)return alert("Your cart is empty");if(!name.value||!phone.value||!address.value||!pincode.value)return alert("Please fill delivery details");let order={id:Date.now(),customer:name.value,phone:phone.value,address:address.value,city:city.value,pincode:pincode.value,total:cart.reduce((s,p)=>s+p.price*p.qty,0),items:cart,status:"New"};let orders=JSON.parse(localStorage.getItem("velqoro_orders")||"[]");orders.push(order);localStorage.setItem("velqoro_orders",JSON.stringify(orders));localStorage.removeItem("velqoro_cart");alert("Order placed successfully! Order #"+order.id);location.href="index.html"}render()</script></body></html>
