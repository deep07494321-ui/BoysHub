<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOYSHUB Admin</title><style>body{font-family:Inter,Arial;background:#f5f5f5;margin:0;color:#111}.top{background:#111;color:#fff;padding:22px 5%;display:flex;justify-content:space-between}.wrap{max-width:1100px;margin:35px auto;padding:0 20px}.box{background:#fff;border-radius:16px;padding:24px;margin-bottom:20px;border:1px solid #eee}input,select{padding:12px;border:1px solid #ddd;border-radius:8px;width:100%;margin:7px 0 14px}button{padding:12px 18px;border:0;border-radius:8px;background:#111;color:#fff;font-weight:700;cursor:pointer}.danger{background:#b00020}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.item{display:flex;justify-content:space-between;padding:15px 0;border-bottom:1px solid #eee}@media(max-width:650px){.row{grid-template-columns:1fr}}</style></head><body><div class="top"><b>BOYSHUB ADMIN</b><a style="color:#fff" href="index.html">Storefront →</a></div><main class="wrap"><div class="box"><h2>Dashboard</h2><p>Products: <b id="pc">0</b> · Orders: <b id="oc">0</b></p></div><div class="box"><h2>Add Product</h2><div class="row"><div><label>Name</label><input id="name" placeholder="Product name"></div><div><label>Price</label><input id="price" type="number" placeholder="499"></div></div><div class="row"><div><label>Category</label><select id="cat"><option>T-Shirts</option><option>Shirts</option><option>Bottomwear</option><option>Hoodies</option></select></div><div><label>Stock</label><input id="stock" type="number" placeholder="20"></div></div><button onclick="add()">Add Product</button></div><div class="box"><h2>Products</h2><div id="list"></div></div><div class="box"><h2>Orders</h2><div id="orders"></div></div></main><script>let products=JSON.parse(localStorage.getItem("boyshub_products")||"null")||[{id:1,name:"Essential Black T-Shirt",price:499,cat:"T-Shirts",stock:20},{id:2,name:"Oversized Street Tee",price:699,cat:"T-Shirts",stock:15}];let orders=JSON.parse(localStorage.getItem("boyshub_orders")||"[]");function save(){localStorage.setItem("boyshub_products",JSON.stringify(products));render()}function add(){let n=name.value.trim();if(!n)return alert("Enter product name");products.push({id:Date.now(),name:n,price:+price.value||0,cat:cat.value,stock:+stock.value||0});save();name.value="";price.value="";stock.value=""}function del(id){products=products.filter(x=>x.id!==id);save()}function render(){pc.textContent=products.length;oc.textContent=orders.length;list.innerHTML=products.map(p=>`<div class=item><span><b>${p.name}</b><br>₹${p.price} · ${p.cat} · Stock ${p.stock}</span><button class=danger onclick="del(${p.id})">Delete</button></div>`).join("")||"<p>No products</p>";orders.innerHTML=orders.map(o=>`<div class=item><span><b>Order #${o.id}</b><br>${o.customer||"Customer"} · ₹${o.total||0}</span><span>${o.status||"New"}</span></div>`).join("")||"<p>No orders yet</p>"}render();</script></body></html>
